  .title{font:700 21px Inter,system-ui,sans-serif;fill:#edf3f7}
  .disclaimer{font:600 10px Inter,system-ui,sans-serif;fill:#f0c674;letter-spacing:1.4px}
  .section{font:700 13px Inter,system-ui,sans-serif;fill:#edf3f7;letter-spacing:.6px}
  .label{font:600 13px Inter,system-ui,sans-serif}
  .value{font:400 13px Inter,system-ui,sans-serif;fill:#c9d6e4}
  .mono{font:400 12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#9fb2c6}
  .note{font:600 12px Inter,system-ui,sans-serif}
</style>
<rect width="1040" height="700" rx="14" fill="#0b1018"/>
<rect x="0.5" y="0.5" width="1039" height="699" rx="14" fill="none" stroke="#293648"/>
<rect x="0" y="0" width="1040" height="8" rx="4" fill="#79dfbc"/>
<text x="34" y="56" class="title">05 · Real-Time Multimodal Application</text>
<text x="34" y="80" class="disclaimer">STRUCTURE PREVIEW — rendered from the running app, not a pixel screenshot</text>
<text x="34" y="100" class="mono">generated by scripts/make_previews.py · no measurement values are claimed here</text>
<text x="34" y="118" class="section">Page</text>
<text x="34" y="150" class="label" fill="#79dfbc">▸ Real-Time Multimodal Application</text>
<text x="34" y="180" class="value" fill="#c9d6e4">  Citation-safe voice and text interaction · AI Portfolio Projects</text>
<text x="34" y="210" class="value" fill="#c9d6e4">  **Local speech recognition: disabled** — set `ENABLE_LOCAL_STT=1` (the shipped Docker image already</text>
<text x="34" y="236" class="value" fill="#c9d6e4">  does) to transcribe recordings on this server. Typed input works without any speech model download.</text>
<text x="34" y="266" class="value" fill="#c9d6e4">  Record at most 30 seconds; uploads are capped at 5 MB.</text>
<text x="34" y="296" class="value" fill="#c9d6e4">  Stopping cancels queued/generator work, not a native STT kernel or an in-flight blocking HTTP read</text>
<text x="34" y="322" class="value" fill="#c9d6e4">  immediately. Worker isolation is needed for hard compute cancellation.</text>
<text x="34" y="352" class="section">Controls</text>
<text x="34" y="384" class="label" fill="#79dfbc">▸ Textbox · Question</text>
<text x="34" y="414" class="label" fill="#79dfbc">▸ Audio · Optional voice question</text>
<text x="34" y="444" class="label" fill="#79dfbc">▸ Checkbox · Read validated answer aloud using offline eSpeak</text>
<text x="34" y="474" class="label" fill="#79dfbc">▸ Button · None</text>
<text x="34" y="504" class="label" fill="#79dfbc">▸ Button · None</text>
<text x="34" y="534" class="label" fill="#79dfbc">▸ Textbox · Answer and evidence</text>
<text x="34" y="564" class="label" fill="#79dfbc">▸ Textbox · Measured stages (milliseconds from submission)</text>
<text x="34" y="594" class="label" fill="#79dfbc">▸ Audio · Validated answer audio</text>
<text x="34" y="624" class="note" fill="#f0c674">▸ Local STT state is printed at runtime from ENABLE_LOCAL_STT (the Docker image sets it to 1).</text>
</svg>
