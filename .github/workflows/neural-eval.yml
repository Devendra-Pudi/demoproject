name: Full neural retrieval gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  neural:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e '.[retrieval]'
      - run: ai-eval --mode neural --output artifacts/neural-eval.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neural-evaluation
          path: artifacts/neural-eval.json
