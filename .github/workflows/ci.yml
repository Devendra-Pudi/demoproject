name: Reliability gates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-ci.txt && pip install --no-deps -e .
      - run: ruff check .
      - run: pytest -q
      - run: ai-eval --mode smoke --baseline data/eval/smoke-baseline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-evaluation
          path: artifacts/rag-eval.json
